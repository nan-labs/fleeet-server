<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fa;
      --text: #212529;
      --text-secondary: #6c757d;
      --border: #dee2e6;
      --primary: #0d6efd;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --card-bg: #ffffff;
      --card-shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --bg-secondary: #2d2d2d;
        --text: #e9ecef;
        --text-secondary: #adb5bd;
        --border: #495057;
        --primary: #4dabf7;
        --success: #51cf66;
        --warning: #ffd43b;
        --danger: #ff6b6b;
        --card-bg: #2d2d2d;
        --card-shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .slug {
      color: var(--text-secondary);
      font-weight: 400;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .summary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 1px 3px var(--card-shadow);
    }

    .summary-stats {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .runs {
      display: grid;
      gap: 1rem;
    }

    .run-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 1px 3px var(--card-shadow);
      transition: box-shadow 0.2s;
    }

    .run-card:hover {
      box-shadow: 0 4px 12px var(--card-shadow);
    }

    .run-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 0.75rem;
    }

    .run-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .agent {
      font-weight: 600;
      color: var(--text);
    }

    .project, .surface {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .state-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .state-shipped {
      background: var(--success);
      color: white;
    }

    .state-in_flight {
      background: var(--primary);
      color: white;
    }

    .state-stopped {
      background: var(--text-secondary);
      color: white;
    }

    .state-blocked {
      background: var(--danger);
      color: white;
    }

    .state-quiet {
      background: var(--warning);
      color: #000;
    }

    .task {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .summary-text {
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .run-footer {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .size {
      font-weight: 600;
    }

    .timestamp {
      margin-left: auto;
    }

    .error {
      background: var(--card-bg);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 1.5rem;
      color: var(--danger);
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    .blocker {
      background: var(--bg-secondary);
      border-left: 3px solid var(--danger);
      padding: 0.75rem;
      margin-top: 0.75rem;
      border-radius: 4px;
    }

    .blocker-kind {
      font-weight: 600;
      color: var(--danger);
      font-size: 0.875rem;
      text-transform: uppercase;
    }

    .blocker-question {
      margin-top: 0.25rem;
    }

    .note {
      background: var(--bg-secondary);
      padding: 0.75rem;
      margin-top: 0.75rem;
      border-radius: 4px;
      font-style: italic;
    }

    .artefacts {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .artefact {
      padding: 0.25rem 0.75rem;
      background: var(--primary);
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }

    .artefact:hover {
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      main {
        padding: 1rem;
      }

      header {
        padding: 1rem;
      }

      .summary-stats {
        gap: 1rem;
      }

      .stat-value {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Board <span class="slug" id="board-slug"></span></h1>
  </header>

  <main>
    <div id="content">
      <div class="loading">Loading board...</div>
    </div>
  </main>

  <script>
    const slug = window.location.pathname.split('/').pop();
    document.getElementById('board-slug').textContent = slug;

    async function loadBoard() {
      const content = document.getElementById('content');
      
      try {
        // Fetch board data
        const eventsRes = await fetch(`/api/boards/${slug}/events`);
        if (!eventsRes.ok) {
          if (eventsRes.status === 401) {
            content.innerHTML = '<div class="error">This board is private. A read token is required.</div>';
          } else if (eventsRes.status === 404) {
            content.innerHTML = '<div class="error">Board not found</div>';
          } else {
            content.innerHTML = `<div class="error">Error loading board: ${eventsRes.statusText}</div>`;
          }
          return;
        }

        const summaryRes = await fetch(`/api/boards/${slug}/summary`);
        const eventsData = await eventsRes.json();
        const summaryData = summaryRes.ok ? await summaryRes.json() : null;

        // Render summary
        let html = '';
        if (summaryData) {
          html += `
            <div class="summary">
              <div class="summary-stats">
                <div class="stat">
                  <div class="stat-value">${summaryData.tasks || 0}</div>
                  <div class="stat-label">${summaryData.period === 'week' ? 'This Week' : 'Today'}</div>
                </div>
                <div class="stat">
                  <div class="stat-value">${summaryData.agents || 0}</div>
                  <div class="stat-label">Agents</div>
                </div>
                ${summaryData.delta !== null ? `
                  <div class="stat">
                    <div class="stat-value">${summaryData.delta > 0 ? '+' : ''}${summaryData.delta}%</div>
                    <div class="stat-label">vs Last ${summaryData.period === 'week' ? 'Week' : 'Day'}</div>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        }

        // Render runs
        if (eventsData.runs && eventsData.runs.length > 0) {
          html += '<div class="runs">';
          for (const run of eventsData.runs) {
            html += `
              <div class="run-card">
                <div class="run-header">
                  <div class="run-meta">
                    <span class="agent">${escapeHtml(run.agent)}</span>
                    ${run.project ? `<span class="project">${escapeHtml(run.project)}</span>` : ''}
                    ${run.surface ? `<span class="surface">${escapeHtml(run.surface)}</span>` : ''}
                  </div>
                  <span class="state-badge state-${run.state}">${run.state.replace('_', ' ')}</span>
                </div>
                ${run.task ? `<div class="task">${escapeHtml(run.task)}</div>` : ''}
                ${run.summary && run.summary !== run.task ? `<div class="summary-text">${escapeHtml(run.summary)}</div>` : ''}
                ${run.blocker ? `
                  <div class="blocker">
                    <div class="blocker-kind">${escapeHtml(run.blocker.kind || 'blocked')}</div>
                    ${run.blocker.question ? `<div class="blocker-question">${escapeHtml(run.blocker.question)}</div>` : ''}
                  </div>
                ` : ''}
                ${run.note ? `<div class="note">${escapeHtml(run.note)}</div>` : ''}
                ${run.artefacts && run.artefacts.length > 0 ? `
                  <div class="artefacts">
                    ${run.artefacts.map(a => `
                      <a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer" class="artefact">
                        ${escapeHtml(a.label || a.kind || 'Link')}
                      </a>
                    `).join('')}
                  </div>
                ` : ''}
                <div class="run-footer">
                  <span class="size">${run.size || 'M'}</span>
                  <span class="timestamp" title="${run.last_at}">${formatTime(run.last_at)}</span>
                </div>
              </div>
            `;
          }
          html += '</div>';
        } else {
          html += '<div class="loading">No activity yet</div>';
        }

        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<div class="error">Error loading board: ${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) return `${diffDays}d ago`;
      
      return date.toLocaleDateString();
    }

    loadBoard();
  </script>
</body>
</html>
